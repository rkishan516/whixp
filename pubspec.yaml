name: whixp
description: Streamline your XMPP messaging with a lightweight Dart-based XMPP client
version: 2.1.4
repository: https://github.com/vsevex/whixp
issue_tracker: https://github.com/vsevex/whixp/issues
topics: [xmpp, network, socket]

environment:
  sdk: ">=3.10.0 <5.0.0"

dependencies:
  connecta: ^1.2.0
  crypto: ^3.0.7
  dnsolve: ^1.0.2
  hive: ^2.2.3
  memoize: ^3.0.0
  synchronized: ^3.4.0
  unorm_dart: ^0.3.2
  web_socket_channel: ^3.0.1
  xml: ^6.6.1

dev_dependencies:
  convert: ^3.1.2
  lint: ^2.8.0
  test: ^1.27.0

platforms:
  android:
  ios:
  macos:
  windows:
